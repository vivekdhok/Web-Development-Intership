<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* For selecting id we use # symbol 
    and for selecting class we use . symbol  */
    .A{
        color: cadetblue;
        text-align: center;
        font-family: cursive;
    }
    .B{
        color: brown;
        text-align: center;
        font-family: cursive;
    }
    .C{
        color: blueviolet;
        text-align: center;
        font-family: cursive;
    }
    
</style>
<body>
    <h1 class="A">Collage</h1>
    <h1 class="B">Student</h1>
    <h1 class="C">Canteen</h1>
</body>
</html>
