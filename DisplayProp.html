<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
            font-size: 22px;
            font-family: 'Times New Roman', Times, serif;
        }
        p.ex01{
            display: none;
        }
        p.ex02{
            display: block;
            background-color: paleturquoise;
        }
        p.ex03{
            display: inline;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Display Property</h1>
    <h1>Display : None</h1>
    <div>
        Here the function disable as None 
        <p class="ex01">Hello Display None</p>
    </div>

    <h1>Display : Block</h1>
    <div>
        Here the function disable as Block 
        <p class="ex02">Hello Display Block</p>
    </div>

    <h1>Display : Inline</h1>
    <div>
        Here the function disable as Inline 
        <p class="ex03">Hello Display Inline</p>
    </div>

</body>
</html>
