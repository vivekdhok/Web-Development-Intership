<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
</head>
<style>
    body{
        background-color: rgb(136, 137, 125);
          display: flex;
        justify-content: center;
        align-items: center;
        font-family: cursive;
    }

    .product{
        background-color: rgb(96, 203, 212);
       border: 2px solid black;
       margin:  20px;
       padding: 10px;
       text-align: center;
       border-radius: 4px;
       box-shadow:6px 12px 20px black;
}
    .product img{
        width: 100px;
        height: 100px;
        border-radius: 4px;
        object-fit: cover;
    }

    button:hover{
        background-color: darkgoldenrod;
        transform: scale(1.1);
        transition: 2ms ;
    }
</style>
</head>
<body>
    <div class="product">
