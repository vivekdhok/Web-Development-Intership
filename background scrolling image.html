    <style>
        /* Here we use body tag due to that only text will scroll not image will scroll and take a entire pages
        in div tag .banner there will only box tag will use  */

            /* whatever text show on this website is setting will change from this setting  */

            text-align: center;

            background-size: cover;
            background-repeat: no-repeat; 
            background-attachment: fixed;
            /* background-attachment: fixed;---> this will only scroll the text not image  */
            
        }
